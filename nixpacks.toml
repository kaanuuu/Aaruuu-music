providers = ["python"]

[variables]
PATH = "/app/.venv/bin:/opt/venv/bin:$PATH"
PYTHONPATH = "/app:/opt/venv/lib/python3.12/site-packages:/app/.venv/lib/python3.12/site-packages"

[phases.setup]
# nodejs is required: yt-dlp's js_runtimes={"node": {}} option (used throughout this
# codebase to decrypt YouTube's signature/nsig challenges) needs a real Node.js binary
# on PATH. Without it, format extraction silently degrades or fails, which shows up
# as "download failed" or bot-check errors even when cookies/PO tokens are fine.
nixPkgs = ["python3", "python3Packages.pip", "ffmpeg", "gcc", "nodejs"]

[phases.install]
cmds = [
  "python3 -m pip install --break-system-packages -r requirements.txt || true",
  "python3 -m venv --system-site-packages /app/.venv || true",
  "/app/.venv/bin/pip install --break-system-packages -r requirements.txt || true",
  "mkdir -p /opt/venv/bin || true",
  "ln -sf /app/.venv/bin/python /opt/venv/bin/python || true",
  "ln -sf /app/.venv/bin/pip /opt/venv/bin/pip || true"
]

[start]
cmd = "bash start.sh"
