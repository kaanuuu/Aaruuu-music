[project]
name = "anonxmusic"
version = "3.0.3"
description = "Telegram Group Calls Streaming bot with some useful features."
readme = ".github/README.md"
requires-python = ">=3.10"

dependencies = [
    "aiohttp~=3.14.3",
    "kurigram>=2.2.25",
    "ntgcalls==3.0.0rc1",
    "pillow~=12.3.0",
    "psutil~=7.2.2",
    "py-tgcalls==3.0.0rc1",
    "py-yt-search~=0.8.0",
    "pymongo>=4.17.0",
    "pytgcrypto>=1.2.12",
    "python-dotenv~=1.2.3",
    "yt-dlp[default]>=2026.8.19",
]
